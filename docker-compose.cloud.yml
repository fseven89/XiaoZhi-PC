version: "3.8"

services:
  xiaozhi-cloud-sentinel:
    build:
      context: .
      dockerfile: Dockerfile.cloud
    container_name: xiaozhi-cloud-sentinel
    restart: always
    env_file:
      - .env
    ports:
      - "8765:8765"
    volumes:
      - ./logs:/app/logs
      - ./workspace:/app/workspace